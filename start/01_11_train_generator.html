<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train Generator</title>
</head>

<body>
  <!-- To run this file right click the file in the navigation bar and select "Open with live server. Then open the developer tools in the browser and head to the console window."-->

  <!-- Use this element to get to the next stop-->
  <button id="next-stop">Next Stop</button>

  <script>
    function* getStop() {
      yield "Ciccio"
      yield "Pasticci"
      yield "Bho"
      yield "Non so"
    }

    const quello = getStop();
    const quelloNext = document.querySelector('#next-stop');
    quelloNext.addEventListener('click', () => {
      let currStop = quello.next();
      if (currStop.done) {
        console.log("we made it");
        quelloNext.setAttribute("disabled", true);
      } else {
        console.log(currStop.value);
      }
    })

  </script>
</body>

</html>
